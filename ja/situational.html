<!doctype html><html lang="ja" dir="ltr" data-static-locale="ja"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>条件付き構成 | MokaTroy TFT</title><meta name="description" content="セット18の条件付き構成ガイド、オーグメントと戦略。"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/comp-cards.css"><style>
.sit-detail{max-width:1100px;margin:30px auto;padding:0 18px}
.sit-back{display:inline-block;color:var(--gold);margin:8px 0 20px;text-decoration:none}
.sit-hero,.sit-panel{border:1px solid var(--line);border-radius:14px;background:rgba(12,16,29,.85);padding:20px;margin-bottom:16px}
.sit-hero h1{margin:8px 0;font:800 clamp(24px,4vw,36px) Outfit,Cairo,sans-serif}
.sit-muted{color:var(--muted);line-height:1.75}
.sit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.sit-panel h2{font:800 18px Outfit,Cairo,sans-serif;margin:0 0 14px}
.sit-augments{display:flex;flex-wrap:wrap;gap:8px}
.sit-augments span{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;font-size:12px}
.sit-stages{display:grid;gap:10px}
.sit-stage{border-inline-start:3px solid var(--gold);padding:8px 12px;background:rgba(255,255,255,.025);border-radius:6px}
.sit-stage strong{display:block;margin-bottom:4px;color:var(--gold)}
.sit-status{font-size:12px;color:var(--muted)}
.sit-augments>span{display:inline-flex;align-items:center;gap:6px}
.sit-item-row{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}
.sit-item-row:last-child{border-bottom:0}
.sit-item-row>div{display:flex;flex-wrap:wrap;gap:6px}
.sit-item-row>div span{font-size:12px;padding:5px 8px;border-radius:7px;background:rgba(233,185,100,.09);border:1px solid var(--line)}
.sit-item-row strong{color:var(--gold)}
.sit-panel p{margin:8px 0}
.sit-panel .sit-augments{line-height:1.6}
.sit-hero .sit-muted{margin:6px 0}
.sit-carry{display:flex;align-items:center;gap:8px}
.sit-unit-icon{width:32px;height:32px;border-radius:7px;object-fit:cover;border:1px solid var(--gold)}
.sit-item-icons{display:flex;flex-wrap:wrap;gap:8px}
.sit-item{display:inline-flex;align-items:center;gap:5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035);max-width:100%}
.sit-item-icon{width:30px;height:30px;object-fit:contain}
.sit-item small{font-size:10px;color:var(--muted)}
.priority-item-icon{width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-inline-end:4px}
@media(max-width:520px){.sit-hero,.sit-panel{padding:14px}.sit-item{flex-direction:column;gap:2px}.sit-item small{max-width:72px;text-align:center}.sit-item-icon{width:27px;height:27px}}
/* Situational comp items: overlay inside the champion hex, not below its frame */
.sit-detail .board-slot{position:absolute}
.sit-detail .board-slot .unit-items{position:absolute!important;top:58px!important;bottom:auto!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important;display:flex!important;justify-content:center!important;gap:0!important;max-width:94%!important;z-index:5!important;white-space:nowrap}
.sit-detail .board-slot .unit-item{width:15px!important;height:15px!important;flex:0 0 15px!important;padding:1px!important}
@media(max-width:800px){.sit-detail .board-slot .unit-items{top:55px!important}.sit-detail .board-slot .unit-item{width:13px!important;height:13px!important;flex-basis:13px!important}}
</style></head><body><div class="ambient orb-a"></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MokaTroy <em>TFT</em></span></a><nav><a href="ja/index.html" data-i18n="navHome">ホームالرئيسية</a><a class="active" href="ja/comps.html" data-i18n="navComps">構成التشكيلات</a><a href="ja/augments.html" data-i18n="navAugments">オーグメントالأوجمنتس</a><a href="ja/champions.html" data-i18n="navChampions">チャンピオンالتشامبيونز</a><a href="ja/items.html" data-i18n="navItems">アイテムالأيتمز</a><a href="ja/traits.html" data-i18n="navTraits">トレイトالتريتس</a><a href="ja/patch.html" data-i18n="navPatch">パッチالباتش</a></nav><button class="lang-toggle" type="button">EN</button></header><main class="sit-detail"><a class="sit-back" href="ja/comps.html">← <span data-sit-label="back">構成一覧に戻る</span></a><div id="situational-detail"><p class="empty">Loading…</p></div></main><footer><span>© 2026 MokaTroy TFT</span><span data-i18n="footer">بيانات تجريبية قابلة للاستبدال مع كل باتش</span></footer><script type="module" src="js/situational.js"></script></body></html>
