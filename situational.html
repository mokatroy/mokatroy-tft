<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Situational Comps | MokaTroy TFT</title><meta name="description" content="Set 18 situational composition guides, augments and strategy."><link rel="stylesheet" href="css/style.css"><style>
.sit-detail{max-width:1100px;margin:30px auto;padding:0 18px}.sit-back{display:inline-block;color:var(--gold);margin:8px 0 20px;text-decoration:none}.sit-hero,.sit-panel{border:1px solid var(--line);border-radius:14px;background:rgba(12,16,29,.85);padding:20px;margin-bottom:16px}.sit-hero h1{margin:8px 0;font:800 clamp(24px,4vw,36px) Outfit,Cairo,sans-serif}.sit-muted{color:var(--muted);line-height:1.75}.sit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}.sit-panel h2{font:800 18px Outfit,Cairo,sans-serif;margin:0 0 14px}.sit-augments{display:flex;flex-wrap:wrap;gap:8px}.sit-augments span{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px;font-size:12px}.sit-stages{display:grid;gap:10px}.sit-stage{border-inline-start:3px solid var(--gold);padding:8px 12px;background:rgba(255,255,255,.025);border-radius:6px}.sit-stage strong{display:block;margin-bottom:4px;color:var(--gold)}.sit-status{font-size:12px;color:var(--muted)}@media(max-width:520px){.sit-hero,.sit-panel{padding:14px}}
.sit-augments>span{display:inline-flex;align-items:center;gap:6px}.sit-item-row{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-bottom:1px solid var(--line)}.sit-item-row:last-child{border-bottom:0}.sit-item-row>div{display:flex;flex-wrap:wrap;gap:6px}.sit-item-row>div span{font-size:12px;padding:5px 8px;border-radius:7px;background:rgba(233,185,100,.09);border:1px solid var(--line)}.sit-item-row strong{color:var(--gold)}.sit-panel p{margin:8px 0}.sit-panel .sit-augments{line-height:1.6}.sit-hero .sit-muted{margin:6px 0}.sit-board-panel{overflow:hidden}.tft-board{padding:22px 10px;border-radius:12px;background:radial-gradient(ellipse at center,rgba(233,185,100,.10),rgba(6,9,18,.65));border:1px solid rgba(233,185,100,.18);overflow-x:auto}.board-row{display:flex;justify-content:center;align-items:flex-end;gap:clamp(4px,1.5vw,14px);min-width:0;flex-wrap:wrap}.board-cell{width:clamp(64px,10vw,94px);height:clamp(74px,11vw,106px);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;flex:0 0 auto}.board-cell:before{content:"";position:absolute;inset:0 2px 12px;background:linear-gradient(145deg,rgba(233,185,100,.18),rgba(42,48,68,.8));border:2px solid rgba(233,185,100,.6);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);filter:drop-shadow(0 3px 5px #000)}.board-champ{position:relative;z-index:1;width:58px;height:58px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:#151927}.board-cell span{z-index:1;max-width:100%;font-size:10px;font-weight:700;text-align:center;text-shadow:0 1px 3px #000}.sit-carry{display:flex;align-items:center;gap:8px}.sit-unit-icon{width:32px;height:32px;border-radius:7px;object-fit:cover;border:1px solid var(--gold)}.sit-item-icons{display:flex;flex-wrap:wrap;gap:8px}.sit-item{display:inline-flex;align-items:center;gap:5px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.035);max-width:100%}.sit-item-icon{width:30px;height:30px;object-fit:contain}.sit-item small{font-size:10px;color:var(--muted)}.priority-item-icon{width:24px;height:24px;object-fit:contain;vertical-align:middle;margin-inline-end:4px}.sit-item-row{gap:9px}.sit-status{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.6}@media(max-width:520px){.board-cell{width:62px;height:72px}.board-champ{width:43px;height:43px}.sit-item{flex-direction:column;gap:2px}.sit-item small{max-width:72px;text-align:center}.sit-item-icon{width:27px;height:27px}}</style></head><body><div class="ambient orb-a"></div><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">M</span><span>MokaTroy <em>TFT</em></span></a><nav><a href="index.html" data-i18n="navHome">الرئيسية</a><a class="active" href="comps.html" data-i18n="navComps">التشكيلات</a><a href="augments.html" data-i18n="navAugments">الأوجمنتس</a><a href="champions.html" data-i18n="navChampions">التشامبيونز</a><a href="items.html" data-i18n="navItems">الأيتمز</a><a href="traits.html" data-i18n="navTraits">التريتس</a><a href="patch.html" data-i18n="navPatch">الباتش</a></nav><button class="lang-toggle" type="button">EN</button></header><main class="sit-detail"><a class="sit-back" href="comps.html">← <span data-sit-label="back">العودة للتشكيلات</span></a><div id="situational-detail"><p class="empty">Loading…</p></div></main><footer><span>© 2026 MokaTroy TFT</span><span data-i18n="footer">بيانات تجريبية قابلة للاستبدال مع كل باتش</span></footer><script type="module" src="js/situational.js"></script></body></html>
